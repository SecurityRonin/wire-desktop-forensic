[workspace]
resolver = "2"
members = ["wire-desktop-core", "wire-desktop-forensic"]

# Single source of truth for fields shared by every member (DRY): bump version /
# MSRV / license here once; members inherit via `field.workspace = true`.
[workspace.package]
version      = "0.1.0"
edition      = "2021"
# MSRV floor is set by the transitive `blob-decoder` (via chromium-storage-indexeddb),
# which needs 1.88 for the V8/Blink structured-clone decoder. The analysis layer
# takes the capability bump (batteries-included) rather than gate it out.
rust-version = "1.88"
license      = "Apache-2.0"
repository   = "https://github.com/SecurityRonin/wire-desktop-forensic"

# Single source of truth for dependency versions (DRY): declare each once; members
# write `dep.workspace = true`. Fleet crates use `version + path` so the local
# checkout builds while the semver requirement stays honest (no wildcard) and
# consumers get the registry version once each is published. Switch to
# registry-only once every Wave-1/2 output is on crates.io.
[workspace.dependencies]
wire-desktop-core = { path = "wire-desktop-core", version = "0.1.0" }
# KNOWLEDGE leaf: the Wire messenger artifact spec (store paths, roles, encryption
# posture) — REUSE its constants, never re-hardcode a path or a store role here.
forensicnomicon-core = { version = "1", path = "../../knowledge/forensicnomicon/crates/core" }
# The normalized report model (`forensicnomicon::report`) the analyzer emits into.
forensicnomicon = { version = "1", path = "../../knowledge/forensicnomicon" }
# Wave-2 storage reader: Chromium IndexedDB-over-LevelDB → decoded
# (database, objectStore, key, V8 value) records, incl. tombstones. Wire's
# Dexie object stores are read through this — we never touch raw LevelDB.
chromium-storage-indexeddb = { version = "0.1", path = "../chromium-storage-forensic/chromium-storage-indexeddb" }
thiserror = "2"

# Paranoid Gatekeeper: these crates interpret untrusted, attacker-controllable
# IndexedDB records recovered from a Wire profile. Never panic, never trust a
# field, never fabricate plaintext for an encrypted value.
[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all                      = { level = "warn", priority = -1 }
pedantic                 = { level = "warn", priority = -1 }
correctness              = { level = "deny", priority = -1 }
suspicious               = { level = "deny", priority = -1 }
unwrap_used              = { level = "deny", priority = 0 }
expect_used              = { level = "deny", priority = 0 }
module_name_repetitions  = { level = "allow", priority = 1 }
must_use_candidate       = { level = "allow", priority = 1 }
missing_errors_doc       = { level = "allow", priority = 1 }
missing_panics_doc       = { level = "allow", priority = 1 }
cast_possible_truncation = { level = "allow", priority = 1 }
cast_possible_wrap       = { level = "allow", priority = 1 }
cast_sign_loss           = { level = "allow", priority = 1 }
cast_precision_loss      = { level = "allow", priority = 1 }
too_many_lines           = { level = "allow", priority = 1 }
items_after_statements   = { level = "allow", priority = 1 }
similar_names            = { level = "allow", priority = 1 }
manual_let_else          = { level = "allow", priority = 1 }

[profile.release]
lto = "thin"
codegen-units = 1

[profile.fuzz]
inherits = "dev"
opt-level = 3
incremental = false
