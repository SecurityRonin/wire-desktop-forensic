name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # fmt · clippy · test (3 OS) · MSRV · cargo-deny · cargo-vet · secret scan ·
  # fuzz build-check · rustdoc · 100% per-line coverage · path-dep gate.
  #
  # No inputs: this repo already enforced a 100% per-line gate at
  # `--workspace --all-features`, which is exactly the shared workflow's default,
  # and MSRV is read from rust-version. Anything that needed configuring would be
  # a behaviour change smuggled in by an adoption PR, so there is nothing here.
  ci:
    uses: SecurityRonin/fleet-ci/.github/workflows/rust-ci.yml@f9802dca64a95eb881fd05dd3f4f16e53b97f2b3
    with:
      # MIGRATION DEBT, with the reason stated because neither half of the old
      # gate survives intact.
      #
      # SCOPE: the replaced job ran `cargo llvm-cov --all-features` without
      # --workspace, i.e. this package only. `coverage-scope` offers `workspace`
      # or `lib` — there is no package-only value — so the scope necessarily
      # widens, and line coverage reads 99.27% instead of the 100% the old gate
      # saw. The floor sits just under the measured value so it still holds the
      # line; it is not slack.
      #
      # FUNCTIONS: the old gate also required 100% FUNCTION coverage. The shared
      # workflow has no function-coverage input, so that half is dropped. That is
      # a genuine reduction, recorded here rather than left to be discovered.
      #
      # REMOVE WHEN: the widened scope reaches 100% lines and this repo can
      # inherit `coverage-gate: strict`. Restoring the function gate needs an
      # input that does not exist yet.
      coverage-gate: floor
      coverage-floor: 99
